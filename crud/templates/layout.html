<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>FLASK CRUD 1.5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script>
      (function() {
        const usuarioLogueado = {% if g.usuario %}true{% else %}false{% endif %};
        if (usuarioLogueado) {
          document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('tema') || 'light');
        } else {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" style="border-bottom: 2px solid black;">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{url_for('index')}}">CRUD IOT</a>
        {% if g.usuario %}
        <div class="d-flex align-items-center">
          <ul class="navbar-nav me-3">
            <li class="nav-item"><a class="nav-link" href="{{url_for('index')}}">Agenda</a></li>
            <li class="nav-item"><a class="nav-link" href="{{url_for('comandos')}}">Comandos</a></li>
          </ul>
          <button id="themeToggle" class="btn btn-outline-light btn-sm me-3" title="Alternar tema">🌙</button>
          <span class="text-light me-3">{{ g.usuario }}</span>
          <a href="{{url_for('logout')}}" class="btn btn-primary btn-sm">Salir</a>
        </div>
        {% endif %}
      </div>
    </nav>

    <div class="container pt-3">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block body %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
