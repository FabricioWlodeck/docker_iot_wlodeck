<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FLASK CRUD 1.5</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Bloque de script inmediato para aplicar el tema guardado antes de renderizar (evita parpadeo blanco) -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
      })();
    </script>

    <style>
      /* Estilos para que los elementos HTML nativos de las otras páginas hereden el tema de Bootstrap */
      table {
        width: 100%;
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
        border-collapse: collapse;
      }
      th, td {
        padding: 0.75rem;
        border-bottom: 1px solid var(--bs-border-color);
        text-align: left;
      }
      thead {
        font-weight: bold;
        background-color: var(--bs-tertiary-bg);
      }
      input[type="text"], input[type="tel"], input[type="email"], input[type="password"] {
        display: block;
        width: 100%;
        max-width: 400px;
        padding: 0.375rem 0.75rem;
        margin-bottom: 1rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: var(--bs-body-color);
        background-color: var(--bs-body-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
      }
      input[type="text"]:focus, input[type="tel"]:focus, input[type="email"]:focus, input[type="password"]:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 .25rem rgba(13,110,253,.25);
      }
      /* Los inputs en línea dentro de formularios simples */
      form input[type="text"], form input[type="tel"], form input[type="email"] {
        display: inline-block;
        width: auto;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
      }
      button, input[type="submit"] {
        display: inline-block;
        font-weight: 400;
        text-align: center;
        vertical-align: middle;
        cursor: pointer;
        user-select: none;
        background-color: var(--bs-primary);
        border: 1px solid var(--bs-primary);
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        border-radius: var(--bs-border-radius);
        color: white;
        transition: color .15s ease-in-out, background-color .15s ease-in-out, border-color .15s ease-in-out;
      }
      button:hover, input[type="submit"]:hover {
        background-color: #0b5ed7;
        border-color: #0a58ca;
      }
    </style>
  </head>
  <body>
    <!-- Barra de navegación superior semántica con Bootstrap -->
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4 border-bottom">
        <div class="container-fluid">
          <a class="navbar-brand" href="{{ url_for('index') }}">FLASK CRUD 1.5</a>
          {% if g.usuario %}
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <div class="d-flex align-items-center ms-auto">
              <span class="navbar-text me-3">Usuario: <strong>{{ g.usuario }}</strong></span>
              
              <!-- Botón de Alternancia de Tema (Semántico, accesible y responsivo) -->
              <button id="themeToggle" class="btn btn-outline-secondary btn-sm" aria-label="Alternar tema claro y oscuro">
                <span id="themeToggleIcon" aria-hidden="true">🌙</span>
                <span id="themeToggleText">Modo Oscuro</span>
              </button>
              
              <a href="{{url_for('logout')}}" class="btn btn-outline-danger btn-sm ms-3">Salir</a>
            </div>
          </div>
          {% endif %}
        </div>
      </nav>
    </header>

    <!-- Contenido principal semántico -->
    <main class="container">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <aside aria-label="Mensajes del sistema" class="mb-4">
            {% for message in messages %}
              <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
              </div>
            {% endfor %}
          </aside>
        {% endif %}
      {% endwith %}

      {% block body %} {% endblock %}
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Controlar el estado del botón de alternancia de tema y sincronizar con localStorage
      document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('themeToggle');
        const themeToggleIcon = document.getElementById('themeToggleIcon');
        const themeToggleText = document.getElementById('themeToggleText');
        
        if (themeToggle) {
          const updateButton = (theme) => {
            if (theme === 'dark') {
              themeToggleIcon.textContent = '☀️';
              themeToggleText.textContent = 'Modo Claro';
            } else {
              themeToggleIcon.textContent = '🌙';
              themeToggleText.textContent = 'Modo Oscuro';
            }
          };

          // Inicializar estado del botón según el tema actual
          const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
          updateButton(currentTheme);
          
          themeToggle.addEventListener('click', () => {
            const activeTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
            const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateButton(newTheme);
          });
        }
      });
    </script>
  </body>
</html>
