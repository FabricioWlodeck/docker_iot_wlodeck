<!DOCTYPE html> 
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>FLASK CRUD 1.5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script>
      (function() {
        const usuarioLogueado = {% if g.usuario %}true{% else %}false{% endif %};
        
        if (usuarioLogueado) {
          // Si está logueado elige el tema
          document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('tema') || 'light');
        } else {
          // Si no esta logeado queda en modo claro
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    {% with messages = get_flashed_messages() %} {% if messages %}
    <ul>
      {% for message in messages %}
      <li>{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %} {% endwith %}
    {% if g.usuario %}
      <div style="float: right;">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" title="Alternar tema">🌙</button>
        {{ g.usuario }} <a href="{{url_for('logout')}}">Salir</a>
      </div>
    {% endif %}
  </head>
  <body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
